name: Debug APK

# Builds an installable, debug-signed APK on every push and on demand.
# No keystore or Play Store secrets are needed — grab the APK from the
# run's Artifacts section and sideload it.
on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list includes the retired 'tools'
          # package, which no longer exists in cmdline-tools 16+ and makes
          # sdkmanager exit 1. Install exactly what compileSdk 36 needs.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build standard debug APK
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5G
        run: ./gradlew assembleStandardDebug --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk/standard/debug -name "*.apk" -exec cp {} artifacts/ \;
          ls -la artifacts/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cashiro-debug-apk
          path: artifacts/*.apk
          retention-days: 30
          if-no-files-found: error
