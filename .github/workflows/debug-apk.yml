name: Debug APK

# Builds an installable, debug-signed APK on every push and on demand.
# No keystore or Play Store secrets are needed — grab the APK from the
# run's Artifacts section and sideload it.
on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Needed to publish the APK as a release, the one download a phone can
    # open without signing in to GitHub.
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list includes the retired 'tools'
          # package, which no longer exists in cmdline-tools 16+ and makes
          # sdkmanager exit 1. Install exactly what compileSdk 36 needs.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Turn Kotlin compile errors into job annotations. Annotations on a public
      # repo can be read through the API without signing in, so a failed build
      # explains itself instead of needing someone to copy the log by hand.
      - name: Register Kotlin error matcher
        run: echo "::add-matcher::.github/kotlin-problem-matcher.json"

      - name: Build standard debug APK
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5G
        run: ./gradlew assembleStandardDebug --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          # The build splits by ABI, which produces five APKs. Only ship the two
          # worth installing: arm64 for any modern phone, universal as a fallback.
          # Shipping all five made the artifact zip several hundred MB.
          for pattern in "*arm64-v8a-debug.apk" "*universal-debug.apk"; do
            find app/build/outputs/apk/standard/debug -name "$pattern" -exec cp {} artifacts/ \;
          done
          ls -lh artifacts/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cashiro-debug-apk
          path: artifacts/*.apk
          retention-days: 30
          if-no-files-found: error

      # The behaviour fixed in this branch. Runs after the APK is uploaded so the
      # APK is available as soon as it builds; a failure here still fails the run.
      - name: Run balance tests
        run: >-
          ./gradlew :app:testStandardDebugUnitTest --stacktrace
          --tests "com.ritesh.cashiro.data.database.dao.BalanceMathTest"
          --tests "com.ritesh.cashiro.data.manager.BalanceUpdateProcessorTest"
          --tests "com.ritesh.cashiro.domain.usecase.AddTransactionUseCaseTest"
          --tests "com.ritesh.cashiro.data.repository.TransactionEditRebalanceTest"
          --tests "com.ritesh.cashiro.data.repository.AccountAttributionTest"
          --tests "com.ritesh.cashiro.data.repository.TransactionDeleteTest"
          --tests "com.ritesh.cashiro.data.repository.DisplayCurrencyAndCardLinkTest"
          --tests "com.ritesh.cashiro.data.manager.FabAlertBookingTest"

      # Artifacts can only be downloaded when signed in to GitHub, which a phone
      # browser rarely is, and they arrive zipped. A release asset is a plain
      # APK at a fixed link anyone can open. Only after the balance tests pass,
      # so the phone link never serves a build that failed them.
      - name: Publish APK to the latest-debug release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls artifacts/*arm64-v8a-debug.apk | head -1)
          cp "$APK" artifacts/cashiro-debug.apk
          gh release delete latest-debug --yes --cleanup-tag || true
          gh release create latest-debug artifacts/cashiro-debug.apk \
            --target "$GITHUB_SHA" \
            --title "Latest debug build" \
            --notes "Debug build of ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. Install cashiro-debug.apk." \
            --prerelease

      # The FAB parser's own tests. Non-blocking because the parser module's
      # tests were never compiled in CI before; failures are still annotated.
      - name: Run FAB parser tests
        continue-on-error: true
        run: ./gradlew :parser-core:test --stacktrace --tests "com.ritesh.parser.core.bank.FABAlertLayoutTest"

      # Non-blocking: the rest of the suite was never run in CI before, so any
      # failure here is pre-existing and should not withhold the APK.
      - name: Run remaining unit tests
        continue-on-error: true
        run: ./gradlew :app:testStandardDebugUnitTest --stacktrace --continue

      # Same idea for test failures: one annotation per failing test, carrying
      # the assertion message. Runs after the full suite too, because that step
      # is allowed to fail and its green tick alone does not say every test passed.
      - name: Annotate test failures
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          def esc_data(s):
              return s.replace('%', '%25').replace('\r', '').replace('\n', '%0A')

          def esc_prop(s):
              return esc_data(s).replace(':', '%3A').replace(',', '%2C')

          count = 0
          for path in glob.glob('*/build/test-results/**/*.xml', recursive=True):
              for case in ET.parse(path).getroot().iter('testcase'):
                  for kind in ('failure', 'error'):
                      node = case.find(kind)
                      if node is None:
                          continue
                      detail = (node.get('message') or node.text or '').strip()[:1500]
                      title = esc_prop(f"{case.get('classname')}.{case.get('name')}")
                      print(f"::error title={title}::{esc_data(detail)}")
                      count += 1
          print(f"{count} failing test(s) annotated")
          PY

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore
